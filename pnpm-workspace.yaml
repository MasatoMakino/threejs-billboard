minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Build and tests pass without these install scripts.
allowBuilds:
  edgedriver: false
  esbuild: false
  geckodriver: false
# These versions came from package-lock.json, and pnpm rates them as trust downgrades.
# Removal condition: a dependency update replaces each version.
trustPolicyExclude:
  - "undici-types@6.21.0"
  - "ua-parser-js@1.0.41"
# demo-showcase 0.1.3 pins vite 8.3.5, which has GHSA-p4f5-76q4-ffq7.
# Removal condition: demo-showcase depends on vite 8.3.7 or later.
overrides:
  "@masatomakino/demo-showcase>vite": 8.3.8
